name: Android CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.2.2
    - name: Setup Java JDK
      uses: actions/setup-java@v3.14.1
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: 'gradle'
    # Debug build only: a push CI sanity check that needs no signing keystore
    # (the signed release APK/AAB is built by build-companion-apk.yml on tags).
    - name: Build with Gradle
      run: ./gradlew assembleDebug

